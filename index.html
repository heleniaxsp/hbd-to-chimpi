<head>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

    <g id="i-tablero"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 12h17M12 3.5v17"/></g>
    <g id="i-foro"><path d="M4 5.5h11v8H8.5L5 16.5v-3H4z"/><path d="M15 9h5v7.5h-1v2.5L16 16.5h-4.5"/></g>
    <g id="i-mosaico"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/><rect x="15.5" y="3.5" width="5" height="5" rx="1.2"/><rect x="15.5" y="11.5" width="5" height="9" rx="1.2"/><rect x="3.5" y="15.5" width="9" height="5" rx="1.2"/></g>
    <g id="i-panel"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></g>
    <g id="i-mas"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-pluma"><path d="M20 4c-7 0-12 4.5-13.5 12.5L5 20"/><path d="M6.5 16.5c5 .5 9-2 11-6.500"/><path d="M9.500 13h5"/></g>
    <g id="i-foto"><rect x="3.500" y="6" width="17" height="13" rx="2"/><circle cx="12" cy="12.500" r="3.200"/><path d="M8.500 6l1.200-2h4.600l1.200 2"/></g>
    <g id="i-video"><rect x="3.500" y="6" width="12" height="12" rx="2"/><path d="M15.500 10.500 20.500 8v8l-5-2.500"/></g>
    <g id="i-audio"><rect x="9" y="3.500" width="6" height="10.500" rx="3"/><path d="M5.500 11.500a6.500 6.500 0 0 0 13 0M12 18v2.500M8.500 20.500h7"/></g>

<!-- Puerta: lo único que ve quien llega sin la palabra clave -->
<div id="puerta" class="puerta espacio">
  <form id="puerta-form" class="puerta-caja" autocomplete="off">
    <p class="rotulo">Transmisión cifrada</p>
    <h1>Hay una sorpresa</h1>
    <p class="puerta-ayuda">Si te invitaron, escribe la palabra clave que venía en el mensaje.</p>
    <label class="campo">
      <span>Palabra clave</span>
      <input id="puerta-clave" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Escríbela aquí">
    </label>
    <p id="puerta-error" class="error" role="alert" hidden></p>
    <button class="btn btn-haz btn-grande" type="submit">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <header class="barra">
    <a class="marca" href="#inicio" data-ir="inicio"><span class="logo" id="logo-letra" aria-hidden="true">R</span><span id="marca-texto">Sorpresa</span></a>
    <a class="barra-panel" href="#panel" data-ir="panel" data-solo-admin hidden><svg class="ico" viewBox="0 0 24 24"><use href="#i-panel"/></svg>Panel</a>
    <nav class="nav-ancha" aria-label="Secciones">
      <a href="#inicio" data-ir="inicio">Inicio</a>
      <a href="#mosaico" data-ir="mosaico">Mosaico</a>
      <a href="#saludos" data-ir="saludos">Saludos</a>
      <a href="#foro" data-ir="foro">Foro</a>
      <a href="#panel" data-ir="panel" data-solo-admin hidden>Panel</a>
      <button class="btn btn-haz" type="button" data-accion="saludar"><svg class="ico" viewBox="0 0 24 24"><use href="#i-mas"/></svg><span data-txt="cta-corto">Dejar mi saludo</span></button>
    </nav>
  </header>

  <div id="aviso-demo" class="aviso-demo" hidden></div>

  <main>
    <section id="v-inicio" class="vista" aria-label="Inicio"></section>
    <section id="v-mosaico" class="vista" aria-label="Mosaico" hidden></section>
    <section id="v-saludos" class="vista" aria-label="Saludos" hidden></section>
    <section id="v-foro" class="vista" aria-label="Foro" hidden></section>
    <section id="v-panel" class="vista" aria-label="Panel de la organizadora" hidden></section>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <a href="#inicio" data-ir="inicio"><svg class="ico" viewBox="0 0 24 24"><use href="#i-inicio"/></svg><span>Inicio</span></a>
    <a href="#mosaico" data-ir="mosaico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-mosaico"/></svg><span>Mosaico</span></a>
    <button type="button" class="tab-mas" data-accion="saludar"><svg class="ico" viewBox="0 0 24 24"><use href="#i-mas"/></svg><span data-txt="cta-tab">Saludar</span></button>
    <a href="#saludos" data-ir="saludos"><svg class="ico" viewBox="0 0 24 24"><use href="#i-tablero"/></svg><span>Saludos</span></a>
    <a href="#foro" data-ir="foro"><svg class="ico" viewBox="0 0 24 24"><use href="#i-foro"/></svg><span>Foro</span></a>
  </nav>
</div>

<!-- Asistente para dejar un saludo -->
<div id="asistente" class="capa" hidden role="dialog" aria-modal="true" aria-labelledby="as-titulo">
  <div class="capa-caja">
    <header class="capa-cab">
      <button type="button" class="btn-icono" id="as-atras" aria-label="Volver"><svg class="ico" viewBox="0 0 24 24"><use href="#i-atras"/></svg></button>
      <ol class="pasos" id="as-pasos" aria-label="Progreso"><li></li><li></li><li></li></ol>
      <button type="button" class="btn-icono" id="as-cerrar" aria-label="Cerrar"><svg class="ico" viewBox="0 0 24 24"><use href="#i-cerrar"/></svg></button>
    </header>
    <div class="capa-cuerpo" id="as-cuerpo"></div>
  </div>
</div>

<!-- Entrada especial para el homenajeado -->
<div id="telon" class="telon espacio" hidden>
  <div class="telon-caja">
    <p class="rotulo" id="telon-rotulo"></p>
    <p class="telon-intro" id="telon-intro"></p>
    <h1 id="telon-titulo"></h1>
    <p id="telon-texto"></p>
    <button type="button" class="btn btn-haz btn-grande" id="telon-abrir">Abrir mi sorpresa</button>
    <p class="telon-firma" id="telon-firma"></p>
  </div>
</div>

<div id="visor" class="visor" hidden><button type="button" class="btn-icono" id="visor-cerrar" aria-label="Cerrar"><svg class="ico" viewBox="0 0 24 24"><use href="#i-cerrar"/></svg></button><img id="visor-img" alt=""></div>
<div id="tostada" class="tostada" role="status" aria-live="polite" hidden></div>
<div id="gatos" class="gatos" aria-hidden="true"></div>

<script src="config.js?v=muyce7wj"></script>
<script src="app.js?v=muyce7wj"></script>
</body>
</html>
